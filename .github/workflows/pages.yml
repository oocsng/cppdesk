name: Pages

# Publishes the landing page in site/ to GitHub Pages (https://oocsng.github.io/cppdesk/).
# The page's only shared asset, the app icon, is copied from assets/ at build time so it is not duplicated in git.

on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/icon.png', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/assets
          cp -r site/. _site/
          cp assets/icon.png _site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
