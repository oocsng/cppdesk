name: Release

# Builds the Linux downloads (AppImage and .deb) for a version tag and attaches them to its GitHub release.
# Run it by hand on a branch to try the packaging without uploading anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Building and testing need no write access; only the upload job gets it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04   # oldest supported glibc, so the downloads also run on older distros
    env:
      CC: gcc-12
      CXX: g++-12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++-12 xvfb libzstd-dev libssl-dev libx11-dev libxtst-dev libxext-dev \
            libxrandr-dev libjpeg-dev libcairo2-dev libpango1.0-dev libpipewire-0.3-dev dbus pkg-config dpkg-dev file
      - name: Version
        run: echo "VERSION=$(grep -oP 'project\(CppDesk VERSION \K[0-9.]+' CMakeLists.txt)" >> "$GITHUB_ENV"
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$VERSION"
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
      - name: Test
        run: cd build && xvfb-run -a -s "-screen 0 1920x1080x24" ./CppDeskTests
      - name: Package
        run: bash scripts/package_linux.sh build out "$VERSION"
      - name: Smoke test the AppImage
        run: |
          ./out/CppDesk-x86_64.AppImage --appimage-extract-and-run --ui-snapshot /tmp/ai
          test "$(ls /tmp/ai/*.png | wc -l)" -eq 30
      - name: Smoke test the .deb
        run: |
          sudo apt-get install -y "./out/cppdesk_${VERSION}_amd64.deb"
          cppdesk --ui-snapshot /tmp/deb
          test "$(ls /tmp/deb/*.png | wc -l)" -eq 30
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: out/

  # The AppImage must start on a plain system without Cairo or Pango, with only what every desktop has, and the
  # .deb must pull in everything it needs on a fresh install.
  packages-on-clean-system:
    needs: build
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: out
      - name: Desktop basics only
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y libx11-6 libxext6 libxrender1 libxcb1 libfontconfig1 \
            libfreetype6 libharfbuzz0b fonts-dejavu-core
      - name: Run the AppImage
        run: |
          chmod +x out/CppDesk-x86_64.AppImage
          out/CppDesk-x86_64.AppImage --appimage-extract-and-run --ui-snapshot /tmp/clean
          test "$(ls /tmp/clean/*.png | wc -l)" -eq 30
      - name: Install and run the .deb
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ./out/cppdesk_*_amd64.deb
          cppdesk --ui-snapshot /tmp/deb
          test "$(ls /tmp/deb/*.png | wc -l)" -eq 30

  upload:
    needs: [build, packages-on-clean-system]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: out
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release is created by hand with the Windows build; give that up to 10 minutes.
          for i in $(seq 60); do
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && break
            sleep 10
          done
          gh release upload "$GITHUB_REF_NAME" out/* --clobber --repo "$GITHUB_REPOSITORY"
