name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-zstd
      - name: Build and run the test suite
        shell: pwsh
        run: |
          $env:PATH = "$env:RUNNER_TEMP\msys64\ucrt64\bin;$env:PATH"
          ./build.ps1 -Test

  # shortcut: no Linux job. ./build.sh --test fails to compile (about 240 errors, mostly Windows-only
  # types in src/net/network_engine.cpp), so a job here could only ever be red. Add one back with the port.
