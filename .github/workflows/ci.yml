name: CI

on:
  push:
    branches: [main, wayland-host]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-zstd
      - name: Build and run the test suite
        shell: pwsh
        run: |
          $env:PATH = "$env:RUNNER_TEMP\msys64\ucrt64\bin;$env:PATH"
          ./build.ps1 -Test

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ xvfb libzstd-dev libssl-dev libx11-dev libxtst-dev libxext-dev libxrandr-dev libjpeg-dev libcairo2-dev libpango1.0-dev libpipewire-0.3-dev dbus pkg-config
      - name: Build and run the test suite
        # The capture and input tests need an X server.
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./build.sh --test
      - name: Real PipeWire check
        # The video receiver against a live PipeWire with a test source. Not a gate yet (continue-on-error).
        continue-on-error: true
        run: |
          sudo apt-get install -y pipewire pipewire-bin wireplumber gstreamer1.0-pipewire gstreamer1.0-tools gstreamer1.0-plugins-base jq
          dbus-run-session -- bash scripts/ci_pipewire_check.sh
      - name: Build the app
        run: cmake --build build --target CppDesk -j 4

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install zstd openssl@3
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          cmake --build build --target CppDeskTests -j 4 2>&1 | tail -150
          test -x build/CppDeskTests
      - name: Run the test suite
        # No Screen Recording permission on a hosted runner: the capture tests draw from a fixed test pattern.
        env:
          CPPDESK_CAPTURE_TEST_PATTERN: "1"
        run: cd build && ./CppDeskTests
      - name: Crash report
        if: failure()
        env:
          CPPDESK_CAPTURE_TEST_PATTERN: "1"
        run: |
          cd build
          lldb -b -o run -o "thread backtrace all" ./CppDeskTests 2>&1 | grep -v "^Test \|^\[TEST" | tail -150
      - name: Draw every screen
        # Offscreen through Core Graphics; the PNGs are what a Mac would show, for comparing with Windows and Linux.
        run: |
          cmake --build build --target CppDesk -j 4
          build/CppDesk.app/Contents/MacOS/CppDesk --ui-snapshot "$RUNNER_TEMP/snap"
          test "$(ls "$RUNNER_TEMP"/snap/*.png | wc -l)" -eq 30
          cp -R "$RUNNER_TEMP/snap" macos-ui-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: macos-ui-snapshots
          path: macos-ui-snapshots
      - name: Package the app for testers
        # Ad-hoc signed with a fixed bundle id. Not a release: macOS ties the Screen Recording and Accessibility
        # permissions to the signature, so a tester grants them again after every new build.
        run: |
          codesign --force --deep -s - -i com.oocsng.cppdesk build/CppDesk.app
          ditto -c -k --keepParent build/CppDesk.app CppDesk-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CppDesk-mac-untested
          path: CppDesk-mac.zip
