name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-zstd
      - name: Build and run the test suite
        shell: pwsh
        run: |
          $env:PATH = "$env:RUNNER_TEMP\msys64\ucrt64\bin;$env:PATH"
          ./build.ps1 -Test

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ xvfb libzstd-dev libssl-dev libx11-dev libxtst-dev libxext-dev libxrandr-dev libjpeg-dev libcairo2-dev libpango1.0-dev pkg-config
      - name: Build and run the test suite
        # The capture and input tests need an X server.
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./build.sh --test
      - name: Build the app
        run: cmake --build build --target CppDesk -j 4
