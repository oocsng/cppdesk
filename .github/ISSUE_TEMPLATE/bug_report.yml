name: Bug Report
description: Report a defect, crash, or unexpected behavior in CppDesk
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue. Please verify you are using the latest version of CppDesk before submitting.

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you running CppDesk on?
      options:
        - Windows 11 (x64)
        - Windows 10 (x64)
        - macOS Sonoma (14.x)
        - macOS Ventura (13.x)
        - macOS Monterey (12.x)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CppDesk Version
      description: Exact version number shown in Settings > About (e.g., v3.5.3)
      placeholder: "v3.5.3"
    validations:
      required: true

  - type: dropdown
    id: connection_mode
    attributes:
      label: Connection Mode
      description: Which network transport were you using when the issue happened?
      options:
        - Direct LAN (Local network)
        - STUN NAT Traversal (P2P WAN)
        - Relay Server
        - Local loopback (--instance 1 / 2)
        - Not connection related
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the problem.
      placeholder: |
        1. Start CppDesk on host machine
        2. Connect from viewer machine with Desk ID
        3. Trigger action X
        4. Observe freeze / error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Diagnostic Logs and Screenshots
      description: Paste any error messages, terminal output, or drag-and-drop screenshots here.
      render: shell
    validations:
      required: false
